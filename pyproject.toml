[project]
name = "orangemango"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "celery[redis]>=5.6.2",
    "fastapi>=0.116.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "langchain>=1.3.14",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.0.0",
    "langchain-tavily>=0.2.0",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langsmith>=0.4.0",
    "mcp>=1.9,<2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.15.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.35.0",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "httpx2>=2.7.0",
    "langgraph-cli[inmem]>=0.2.6",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "bandit>=1.9.4",
    "pip-audit>=2.9.0",
    "pre-commit>=4.0.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
