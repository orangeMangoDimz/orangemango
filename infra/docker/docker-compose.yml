# [Project]
# Sets the Docker Compose project name.
name: orangemango

# [Services]
# Defines the application and database containers.
services:
  # [API Service]
  # Builds and runs the Orangemango API.
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # [AI Providers]
      # API credentials and model settings for AI-powered features.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}

      # [Observability]
      # Optional tracing settings for monitoring and debugging.
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-orangemango}

      # [Database Connection]
      # Connection settings used by the API to reach PostgreSQL.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}

  # [PostgreSQL Service]
  # Runs the PostgreSQL database used by the API.
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      # [Database Credentials]
      # Credentials and database name used to initialize PostgreSQL.
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

# [Persistent Storage]
# Keeps PostgreSQL data across container restarts.
volumes:
  postgres_data:
